<div class="grid grid-cols-5 gap-2 w-full max-w-3xl mx-auto aspect-square">
    {% for square in session.board %}
    {% set is_winning = square.id in session.winning_square_ids %}
    <button {% if not square.is_free_space %} hx-post="/toggle/{{ square.id }}" hx-target="#game-container"
        hx-swap="outerHTML" {% endif %} {% if square.is_free_space %}disabled{% endif %} class="board-cell btn-square
            {%- if square.is_marked %}
                {%- if is_winning %} btn-square-winner
                {%- else %} btn-square-checked
                {%- endif %}
            {%- else %} bg-white text-slate-800 hover:bg-slate-50
            {%- endif %}
            {%- if square.is_free_space %} btn-square-free text-sm font-semibold{% endif %}"
        aria-pressed="{{ 'true' if square.is_marked else 'false' }}"
        aria-label="{{ 'Free space' if square.is_free_space else square.text }}">
        <span class="wrap-break-word hyphens-auto">{{ square.text }}</span>
        {% if square.is_marked and not square.is_free_space %}
        <span class="cell-badge">✓</span>
        {% endif %}
    </button>
    {% endfor %}
</div>
